<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' vault:; media-src vault:">
<title>Blindspot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="lock" hidden>
  <form id="lockForm">
    <img src="logo.svg" class="logo" alt="">
    <h1>Blindspot</h1>
    <p id="lockHint"></p>
    <input type="password" id="pw" placeholder="Password" aria-label="Password">
    <input type="password" id="pw2" placeholder="Repeat password" aria-label="Repeat password" hidden>
    <button id="unlockBtn">Unlock</button>
    <p class="error" id="lockError" role="status"></p>
  </form>
</main>

<div id="gallery" hidden>
  <aside id="side">
    <h1><img src="logo.svg" alt="">Blindspot</h1>
    <nav id="folders" aria-label="Folders"></nav>
    <form id="folderForm"><input id="folderName" placeholder="+ New folder" aria-label="New folder name" maxlength="60"></form>
  </aside>
  <div id="main">
    <header>
      <h2 id="title">All items</h2>
      <span id="status" role="status"></span>
      <button id="noteBtn" class="ghost">New note</button>
      <button id="addBtn">Add photos &amp; videos</button>
      <button id="lockBtn" class="ghost">Lock</button>
    </header>
    <p id="empty" hidden></p>
    <section id="grid"></section>
  </div>
</div>

<div id="viewer" hidden>
  <div class="bar">
    <span id="vName"></span><span class="spacer"></span>
    <select id="vFolder" aria-label="Folder"></select>
    <button id="vExport">Export</button>
    <button id="vDelete" class="danger">Delete</button>
    <button id="vClose" class="ghost" aria-label="Close">✕</button>
  </div>
  <div id="stage"></div>
  <button class="nav prev" aria-label="Previous">‹</button>
  <button class="nav next" aria-label="Next">›</button>
</div>

<div id="drop" hidden></div>
<script src="app.js"></script>
</body>
</html>
